name: Public CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'develop/**'
      - 'migration/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-safety:
    name: Public safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Scan repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          test ! -f .env.staging
          if grep -RInE --exclude-dir=.git --exclude='*.sum' --exclude='ci.yml' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|AKIA[0-9A-Z]{16})' .; then
            echo 'public-safety scan detected credential-like material' >&2
            exit 1
          fi

  static-analysis:
    name: Format and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: make fmt-check

      - name: Vet
        run: go vet ./...

  unit:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Diagnose freshness evaluator
        continue-on-error: true
        run: go test ./internal/networkpolicy -run '^(TestEvaluate|TestParseVerificationEvidence)' -count=1

      - name: Diagnose preflight admission
        continue-on-error: true
        run: go test ./internal/networkpolicy -run '^TestVerificationPreflightAdmission' -count=1

      - name: Diagnose current and admission consumers
        continue-on-error: true
        run: go test ./internal/networkpolicy -run '^(TestBuildCurrent|TestApplyCurrent|TestParseVerificationPreflightAdmission)' -count=1

      - name: Run side-effect-free tests
        run: go test ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build control-center
        run: go build -trimpath -buildvcs=false ./cmd/control-center

  postgres-migration-qualification:
    name: PostgreSQL ${{ matrix.postgres }} / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - '15'
          - '16'
          - '17'
          - '18'
        scenario:
          - clean-install
          - supported-upgrade
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run isolated migration scenario
        shell: bash
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
          QUALIFICATION_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          case "$QUALIFICATION_SCENARIO" in
            clean-install)
              qualification_test=TestPostgresCleanInstallAndRestart
              ;;
            supported-upgrade)
              qualification_test=TestPostgresUpgradeFrom03PreservesLegacyState
              ;;
            *)
              echo 'unsupported qualification scenario' >&2
              exit 2
              ;;
          esac
          go test ./migrations -run "^${qualification_test}$" -count=1 -v

  postgres-adapter-compatibility:
    name: PostgreSQL ${{ matrix.postgres }} adapters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - '15'
          - '16'
          - '17'
          - '18'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install current schema for adapter tests
        env:
          MIGRATION_INSTALL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test ./migrations -run '^TestPostgresInstallCurrentSchemaFixture$' -count=1 -v

      - name: Verify PostgreSQL adapters and restart recovery
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test ./internal/persistence/postgres -run '^TestPostgres' -count=1 -v

  race:
    name: Race and PostgreSQL restart tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_center_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install current schema for race tests
        env:
          MIGRATION_INSTALL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test ./migrations -run '^TestPostgresInstallCurrentSchemaFixture$' -count=1

      - name: Run race detector with PostgreSQL adapters
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/control_center_test?sslmode=disable
        run: go test -race -count=1 ./...

  release-candidate-evidence:
    # Keep this historical check name until repository rules are explicitly
    # migrated. Public Stable 0.31.0 is immutable; generic development CI must
    # never mint fresh 0.31 candidate/release evidence from later source trees.
    name: 0.31 release evidence aggregation
    if: always()
    needs:
      - public-safety
      - static-analysis
      - unit
      - build
      - postgres-migration-qualification
      - postgres-adapter-compatibility
      - race
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require upstream qualification PASS
        shell: bash
        env:
          PUBLIC_SAFETY: ${{ needs.public-safety.result }}
          STATIC_ANALYSIS: ${{ needs.static-analysis.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          POSTGRES_MIGRATION: ${{ needs.postgres-migration-qualification.result }}
          POSTGRES_ADAPTER: ${{ needs.postgres-adapter-compatibility.result }}
          RACE: ${{ needs.race.result }}
        run: |
          set -euo pipefail
          for value in "$PUBLIC_SAFETY" "$STATIC_ANALYSIS" "$UNIT" "$BUILD" "$POSTGRES_MIGRATION" "$POSTGRES_ADAPTER" "$RACE"; do
            [[ "$value" == success ]]
          done

      - name: Preserve immutable 0.31 release boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'Control Center 0.31.0 is already Public Stable.'
          echo 'Generic CI intentionally does not build or publish new 0.31 candidate evidence from later source revisions.'
          echo 'A version-specific release gate is required before any future release publication.'
