name: Publish official release

on:
  workflow_run:
    workflows:
      - Public CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: official-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    name: Tag and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate release inputs
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/RELEASE_${version}_RU.md"
          test -f "$notes"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Detect already-published immutable release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify already-published release remains immutable
        if: steps.existing.outputs.published == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          python3 - "$RELEASE_TAG" "$tag_sha" "$release_json" <<'PY'
          import json, re, sys
          tag, tag_sha, raw = sys.argv[1:]
          data = json.loads(raw)
          if data.get("tag_name") != tag or data.get("draft") is not False or data.get("prerelease") is not False:
              raise SystemExit("published_release_not_stable")
          if re.fullmatch(r"[0-9a-f]{40}", tag_sha) is None:
              raise SystemExit("published_release_tag_identity_invalid")
          print(f"PUBLISHED_RELEASE_IMMUTABLE={tag}@{tag_sha}")
          PY

      - name: Require a version-specific automatic publication gate
        if: steps.existing.outputs.published != 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          case "$RELEASE_VERSION" in
            0.31.0|0.32.0) ;;
            *)
              echo "Automatic publication gate is not defined for Control Center ${RELEASE_VERSION}; refusing publication" >&2
              exit 1
              ;;
          esac

      - name: Download exact 0.31 release evidence
        if: steps.existing.outputs.published != 'true' && steps.release.outputs.version == '0.31.0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p dist/public-stable-evidence
          gh run download "$TRIGGER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "control-center-0.31.0-release-evidence-${RELEASE_SHA}" \
            --dir dist/public-stable-evidence
          test -f dist/public-stable-evidence/control-center-0.31.0.readiness.json

      - name: Download exact 0.32 release evidence
        if: steps.existing.outputs.published != 'true' && steps.release.outputs.version == '0.32.0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p dist/public-stable-evidence
          gh run download "$TRIGGER_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "control-center-0.32.0-release-evidence-${RELEASE_SHA}" \
            --dir dist/public-stable-evidence
          test -f dist/public-stable-evidence/release-032/control-center-0.32.0.readiness.json
          test -f dist/public-stable-evidence/candidate-0.32.0/control-center-0.32.0.release-manifest.json

      - name: Set up Go for Stable gate
        if: steps.existing.outputs.published != 'true' && (steps.release.outputs.version == '0.31.0' || steps.release.outputs.version == '0.32.0')
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Require exact 0.31 technical Public Stable readiness
        if: steps.existing.outputs.published != 'true' && steps.release.outputs.version == '0.31.0'
        shell: bash
        run: |
          set -euo pipefail
          validator_dir="$(mktemp -d "$PWD/.stable-readiness-validator.XXXXXX")"
          trap 'rm -rf "$validator_dir"' EXIT
          cat > "$validator_dir/main.go" <<'GO'
          package main
          import (
            "encoding/json"
            "fmt"
            "os"
            "control-center/internal/releasecandidate"
          )
          func main() {
            raw, err := os.ReadFile(os.Args[1]); if err != nil { panic(err) }
            var snapshot releasecandidate.Snapshot
            if err := json.Unmarshal(raw, &snapshot); err != nil { panic(err) }
            product, err := releasecandidate.EvaluateProductStable(snapshot); if err != nil { panic(err) }
            if !product.Ready || len(product.Blockers) != 0 {
              panic(fmt.Sprintf("product Stable readiness blocked: %v", product.Blockers))
            }
            commercial, err := releasecandidate.Evaluate(snapshot); if err != nil { panic(err) }
            if !commercial.Ready {
              if len(commercial.Blockers) != 1 || commercial.Blockers[0] != releasecandidate.GateCommercialLegal {
                panic(fmt.Sprintf("unexpected non-commercial blockers: %v", commercial.Blockers))
              }
            }
            fmt.Println("PRODUCT_PUBLIC_STABLE_READINESS=PASS")
          }
          GO
          go run "$validator_dir/main.go" dist/public-stable-evidence/control-center-0.31.0.readiness.json

      - name: Require exact 0.32 technical Public Stable readiness
        if: steps.existing.outputs.published != 'true' && steps.release.outputs.version == '0.32.0'
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          validator_dir="$(mktemp -d "$PWD/.stable-readiness-validator-032.XXXXXX")"
          trap 'rm -rf "$validator_dir"' EXIT
          cat > "$validator_dir/main.go" <<'GO'
          package main
          import (
            "encoding/json"
            "fmt"
            "os"
            "control-center/internal/releasecandidate"
          )
          func main() {
            raw, err := os.ReadFile(os.Args[1]); if err != nil { panic(err) }
            var snapshot releasecandidate.Snapshot
            if err := json.Unmarshal(raw, &snapshot); err != nil { panic(err) }
            product, err := releasecandidate.EvaluateProductStable032(snapshot); if err != nil { panic(err) }
            if !product.Ready || len(product.Blockers) != 0 {
              panic(fmt.Sprintf("0.32 product Stable readiness blocked: %v", product.Blockers))
            }
            commercial, err := releasecandidate.Evaluate032(snapshot); if err != nil { panic(err) }
            if commercial.Ready || len(commercial.Blockers) != 1 || commercial.Blockers[0] != releasecandidate.GateCommercialLegal {
              panic(fmt.Sprintf("0.32 commercial boundary invalid: ready=%v blockers=%v", commercial.Ready, commercial.Blockers))
            }
            fmt.Println("CC_032_PRODUCT_PUBLIC_STABLE_READINESS=PASS")
          }
          GO
          go run "$validator_dir/main.go" dist/public-stable-evidence/release-032/control-center-0.32.0.readiness.json
          python3 - "$RELEASE_SHA" dist/public-stable-evidence/candidate-0.32.0/control-center-0.32.0.release-manifest.json <<'PY'
          import json,re,sys
          sha,path=sys.argv[1:]
          if re.fullmatch(r"[0-9a-f]{40}",sha) is None:
              raise SystemExit("invalid_release_sha")
          with open(path,encoding="utf-8") as f: manifest=json.load(f)
          if manifest.get("version")!="0.32.0" or manifest.get("revision")!=sha:
              raise SystemExit("release_manifest_identity_mismatch")
          if manifest.get("status")!="candidate-only-not-public-stable" or manifest.get("publication_authority") is not False:
              raise SystemExit("release_manifest_boundary_invalid")
          PY

      - name: Publish exact qualified release
        if: steps.existing.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag_sha=""
          if existing_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            tag_sha="$existing_tag_sha"
          fi
          if [[ -n "$tag_sha" && "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "${RELEASE_TAG} already points to ${tag_sha}, expected ${RELEASE_SHA}" >&2
            exit 1
          fi
          if [[ -z "$tag_sha" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$RELEASE_SHA" >/dev/null
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Control Center ${RELEASE_VERSION}" \
            --notes-file "$RELEASE_NOTES" \
            --verify-tag
