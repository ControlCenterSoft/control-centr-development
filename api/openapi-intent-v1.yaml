openapi: 3.1.0
info:
  title: Control Center Intent and Synthesis API
  version: 0.43.0
  description: >-
    Read-only views for normalized Infrastructure Intent, Blueprint revisions,
    Solution Synthesis assessments/candidates/decisions and Expansion assessments.
    Mutations are intentionally excluded from Slice A and later use exact-revision
    Change/Job boundaries where infrastructure state can be affected.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v1/intents:
    get:
      operationId: listInfrastructureIntentsV1
      parameters:
        - name: scope_id
          in: query
          schema: { $ref: '#/components/schemas/ObjectIdentifier' }
      responses:
        '200':
          description: Intents visible in the caller scope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InfrastructureIntent' }
                  count: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/intents/{intentId}:
    get:
      operationId: getInfrastructureIntentV1
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectIdentifier' }
      responses:
        '200':
          description: Infrastructure intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfrastructureIntent' }
        '404': { description: Intent not found }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/intents/{intentId}/revisions:
    get:
      operationId: listIntentRevisionsV1
      parameters:
        - name: intentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectIdentifier' }
      responses:
        '200':
          description: Ordered intent revisions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IntentRevision' }
                  count: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/blueprints:
    get:
      operationId: listSolutionBlueprintsV1
      responses:
        '200':
          description: Solution blueprints visible in the caller scope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SolutionBlueprint' }
                  count: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/blueprints/{blueprintId}/revisions:
    get:
      operationId: listBlueprintRevisionsV1
      parameters:
        - name: blueprintId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectIdentifier' }
      responses:
        '200':
          description: Ordered blueprint revisions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BlueprintRevision' }
                  count: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/synthesis/{assessmentId}:
    get:
      operationId: getSynthesisAssessmentV1
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectIdentifier' }
      responses:
        '200':
          description: Synthesis assessment and bounded candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynthesisAssessmentView' }
        '404': { description: Assessment not found }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/expansion-assessments/{assessmentId}:
    get:
      operationId: getExpansionAssessmentV1
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectIdentifier' }
      responses:
        '200':
          description: Expansion assessment with explainable options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpansionAssessment' }
        '404': { description: Expansion assessment not found }
        default: { $ref: '#/components/responses/APIError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    sessionCookie:
      type: apiKey
      in: cookie
      name: cc_session
  responses:
    APIError:
      description: Stable API error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ObjectIdentifier:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._:-]{0,253}[A-Za-z0-9])?$'
    CanonicalIdentifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[a-z0-9](?:[a-z0-9._:-]{0,126}[a-z0-9])?$'
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    ObjectMetadata:
      type: object
      additionalProperties: false
      required: [object_id, scope_id, owner_scope, generation, resource_version, created_at, updated_at]
      properties:
        object_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        scope_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        owner_scope: { $ref: '#/components/schemas/ObjectIdentifier' }
        generation: { type: integer, minimum: 1 }
        resource_version: { type: string, minLength: 1, maxLength: 255, pattern: '^\S+$' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IntentRevisionState:
      type: string
      enum:
        - draft
        - normalized
        - needs_clarification
        - confirmed
        - feasibility_checked
        - satisfied
        - partially_satisfied
        - unsatisfiable
        - stale
        - superseded
    RequirementClass:
      type: string
      enum: [hard_constraint, soft_preference, optimization_objective]
    ProviderPreferenceMode:
      type: string
      enum: [required, preferred, avoid, unspecified]
    ReuseMode:
      type: string
      enum: [reuse_preferred, reuse_required, reuse_optional]
    Requirement:
      type: object
      additionalProperties: false
      required: [id, class, domain, key, operator, value]
      properties:
        id: { $ref: '#/components/schemas/CanonicalIdentifier' }
        class: { $ref: '#/components/schemas/RequirementClass' }
        domain: { $ref: '#/components/schemas/CanonicalIdentifier' }
        key: { $ref: '#/components/schemas/CanonicalIdentifier' }
        operator: { type: string, minLength: 1, maxLength: 64 }
        value: {}
    ProviderPreference:
      type: object
      additionalProperties: false
      required: [provider_id, mode]
      properties:
        provider_id: { $ref: '#/components/schemas/CanonicalIdentifier' }
        mode: { $ref: '#/components/schemas/ProviderPreferenceMode' }
    ReusePolicy:
      type: object
      additionalProperties: false
      required: [mode, preserve_workloads, allow_migration, allow_reinstall]
      properties:
        mode: { $ref: '#/components/schemas/ReuseMode' }
        preserve_workloads: { type: boolean }
        allow_migration: { type: boolean }
        allow_reinstall: { type: boolean }
    InfrastructureIntent:
      allOf:
        - $ref: '#/components/schemas/ObjectMetadata'
        - type: object
          required: [display_name]
          properties:
            display_name: { type: string, minLength: 1, maxLength: 160 }
            current_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
    IntentRevision:
      allOf:
        - $ref: '#/components/schemas/ObjectMetadata'
        - type: object
          required: [intent_id, ordinal, state, requirements, reuse_policy]
          properties:
            intent_id: { $ref: '#/components/schemas/ObjectIdentifier' }
            ordinal: { type: integer, minimum: 1 }
            state: { $ref: '#/components/schemas/IntentRevisionState' }
            requirements:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/Requirement' }
            provider_preferences:
              type: array
              uniqueItems: true
              items: { $ref: '#/components/schemas/ProviderPreference' }
            reuse_policy: { $ref: '#/components/schemas/ReusePolicy' }
    BlueprintQualificationStatus:
      type: string
      enum: [draft, qualified, deprecated]
    BlueprintRole:
      type: object
      additionalProperties: false
      required: [id, kind, min_count, max_count]
      properties:
        id: { $ref: '#/components/schemas/CanonicalIdentifier' }
        kind: { $ref: '#/components/schemas/CanonicalIdentifier' }
        min_count: { type: integer, minimum: 1 }
        max_count: { type: integer, minimum: 0 }
        required_capabilities:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/CanonicalIdentifier' }
    TopologyRule:
      type: object
      additionalProperties: false
      required: [from_role, to_role, relation, required]
      properties:
        from_role: { $ref: '#/components/schemas/CanonicalIdentifier' }
        to_role: { $ref: '#/components/schemas/CanonicalIdentifier' }
        relation: { $ref: '#/components/schemas/CanonicalIdentifier' }
        required: { type: boolean }
    SolutionBlueprint:
      allOf:
        - $ref: '#/components/schemas/ObjectMetadata'
        - type: object
          required: [display_name]
          properties:
            display_name: { type: string, minLength: 1, maxLength: 160 }
            current_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
    BlueprintRevision:
      allOf:
        - $ref: '#/components/schemas/ObjectMetadata'
        - type: object
          required: [blueprint_id, ordinal, qualification_status, blueprint_digest, roles]
          properties:
            blueprint_id: { $ref: '#/components/schemas/ObjectIdentifier' }
            ordinal: { type: integer, minimum: 1 }
            qualification_status: { $ref: '#/components/schemas/BlueprintQualificationStatus' }
            blueprint_digest: { $ref: '#/components/schemas/Digest' }
            signature_ref: { type: string, minLength: 1, maxLength: 255 }
            intent_classes:
              type: array
              uniqueItems: true
              items: { $ref: '#/components/schemas/CanonicalIdentifier' }
            roles:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/BlueprintRole' }
            topology_rules:
              type: array
              items: { $ref: '#/components/schemas/TopologyRule' }
            expansion_strategies:
              type: array
              uniqueItems: true
              items: { $ref: '#/components/schemas/CanonicalIdentifier' }
    AssessmentState:
      type: string
      enum: [pending, running, completed, stale, failed]
    CandidateStatus:
      type: string
      enum: [valid, valid_with_warning, blocked]
    ConstraintStatus:
      type: string
      enum: [pass, warning, blocked, unknown]
    ConstraintResult:
      type: object
      additionalProperties: false
      required: [requirement_id, status, reason]
      properties:
        requirement_id: { type: string, minLength: 1, maxLength: 255 }
        status: { $ref: '#/components/schemas/ConstraintStatus' }
        reason: { type: string, minLength: 1, maxLength: 2048 }
    SolutionCandidate:
      allOf:
        - $ref: '#/components/schemas/ObjectMetadata'
        - type: object
          required: [assessment_id, status, topology_digest, constraint_results]
          properties:
            assessment_id: { $ref: '#/components/schemas/ObjectIdentifier' }
            status: { $ref: '#/components/schemas/CandidateStatus' }
            topology_digest: { $ref: '#/components/schemas/Digest' }
            provider_binding_refs:
              type: array
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 255 }
            score: { type: number, minimum: 0, maximum: 1 }
            constraint_results:
              type: array
              items: { $ref: '#/components/schemas/ConstraintResult' }
            tradeoffs:
              type: array
              items: { type: string, minLength: 1, maxLength: 2048 }
    SynthesisAssessment:
      allOf:
        - $ref: '#/components/schemas/ObjectMetadata'
        - type: object
          required:
            - intent_revision_id
            - blueprint_revision_id
            - input_snapshot_digest
            - provider_catalog_digest
            - policy_revision
            - state
          properties:
            intent_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
            blueprint_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
            input_snapshot_digest: { $ref: '#/components/schemas/Digest' }
            provider_catalog_digest: { $ref: '#/components/schemas/Digest' }
            policy_revision: { type: string, minLength: 1, maxLength: 255 }
            state: { $ref: '#/components/schemas/AssessmentState' }
            evaluated_at: { type: string, format: date-time }
    SynthesisDecision:
      allOf:
        - $ref: '#/components/schemas/ObjectMetadata'
        - type: object
          required: [assessment_id, selected_candidate_id, rationale, decided_at]
          properties:
            assessment_id: { $ref: '#/components/schemas/ObjectIdentifier' }
            selected_candidate_id: { $ref: '#/components/schemas/ObjectIdentifier' }
            rationale: { type: string, minLength: 1, maxLength: 2048 }
            resulting_solution_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
            decided_at: { type: string, format: date-time }
    SynthesisAssessmentView:
      type: object
      additionalProperties: false
      required: [assessment, candidates]
      properties:
        assessment: { $ref: '#/components/schemas/SynthesisAssessment' }
        candidates:
          type: array
          maxItems: 25
          items: { $ref: '#/components/schemas/SolutionCandidate' }
        decision: { $ref: '#/components/schemas/SynthesisDecision' }
    ExpansionStrategy:
      type: string
      enum: [scale_up, scale_out, new_instance, new_cluster, split_migrate, replace, no_change]
    ExpansionOption:
      type: object
      additionalProperties: false
      required: [strategy, status, reason]
      properties:
        strategy: { $ref: '#/components/schemas/ExpansionStrategy' }
        status: { $ref: '#/components/schemas/CandidateStatus' }
        reason: { type: string, minLength: 1, maxLength: 2048 }
        plan_digest: { $ref: '#/components/schemas/Digest' }
    ExpansionAssessment:
      allOf:
        - $ref: '#/components/schemas/ObjectMetadata'
        - type: object
          required: [solution_revision_id, input_snapshot_digest, state, options]
          properties:
            solution_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
            input_snapshot_digest: { $ref: '#/components/schemas/Digest' }
            state: { $ref: '#/components/schemas/AssessmentState' }
            options:
              type: array
              minItems: 1
              uniqueItems: true
              items: { $ref: '#/components/schemas/ExpansionOption' }
            evaluated_at: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, minLength: 1, maxLength: 128 }
        message: { type: string, minLength: 1, maxLength: 1024 }
        request_id: { type: string, maxLength: 255 }
