openapi: 3.1.0
info:
  title: Control Center Infrastructure Solutions API
  version: 0.43.0
  description: >-
    Read-only InfrastructureSolution, topology, architecture-validation and
    deployment-plan views. Mutation/execution remains behind exact-revision
    Change/Approval/Job contracts and is intentionally not exposed here.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v1/solutions:
    get:
      operationId: listInfrastructureSolutionsV1
      parameters:
        - name: scope_id
          in: query
          schema: { $ref: '#/components/schemas/ObjectIdentifier' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/SolutionState' }
      responses:
        '200':
          description: Infrastructure solutions visible in the caller scope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InfrastructureSolution' }
                  count: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/solutions/{solutionId}:
    get:
      operationId: getInfrastructureSolutionV1
      parameters:
        - $ref: '#/components/parameters/SolutionId'
      responses:
        '200':
          description: Infrastructure solution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfrastructureSolution' }
        '404': { description: Solution not found }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/solutions/{solutionId}/revisions:
    get:
      operationId: listSolutionRevisionsV1
      parameters:
        - $ref: '#/components/parameters/SolutionId'
      responses:
        '200':
          description: Ordered solution revisions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SolutionRevision' }
                  count: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/solutions/{solutionId}/topology:
    get:
      operationId: getCurrentSolutionTopologyV1
      parameters:
        - $ref: '#/components/parameters/SolutionId'
      responses:
        '200':
          description: Topology for the current solution revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopologyView' }
        '404': { description: Solution or current revision not found }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/solutions/{solutionId}/validation:
    get:
      operationId: getCurrentSolutionValidationV1
      parameters:
        - $ref: '#/components/parameters/SolutionId'
      responses:
        '200':
          description: Latest architecture validation for the current revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchitectureValidationResult' }
        '404': { description: Validation result not found }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/deployment-plans/{planId}:
    get:
      operationId: getDeploymentPlanV1
      parameters:
        - name: planId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectIdentifier' }
      responses:
        '200':
          description: Exact-revision deployment plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentPlan' }
        '404': { description: Deployment plan not found }
        default: { $ref: '#/components/responses/APIError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    sessionCookie:
      type: apiKey
      in: cookie
      name: cc_session
  parameters:
    SolutionId:
      name: solutionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectIdentifier' }
  responses:
    APIError:
      description: Stable API error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ObjectIdentifier:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._:-]{0,253}[A-Za-z0-9])?$'
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    SolutionState:
      type: string
      enum:
        - draft
        - designed
        - validated
        - planned
        - deploying
        - adopting
        - verifying
        - ready
        - operating
        - scaling
        - updating
        - reconfiguring
        - maintaining
        - migrating
        - recovering
        - shrinking
        - decommissioning
        - degraded
        - failed
        - unknown
        - recovery_required
    RevisionState:
      type: string
      enum: [proposed, validated, planned, active, superseded, stale]
    ValidationStatus:
      type: string
      enum: [valid, warning, blocked, unknown]
    FindingSeverity:
      type: string
      enum: [info, warning, blocking]
    PlanState:
      type: string
      enum: [draft, validated, stale, superseded]
    InfrastructureSolution:
      type: object
      additionalProperties: false
      required:
        - object_id
        - scope_id
        - owner_scope
        - generation
        - resource_version
        - created_at
        - updated_at
        - display_name
        - state
      properties:
        object_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        scope_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        owner_scope: { $ref: '#/components/schemas/ObjectIdentifier' }
        generation: { type: integer, minimum: 1 }
        resource_version: { type: string, minLength: 1, maxLength: 255, pattern: '^\S+$' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        state: { $ref: '#/components/schemas/SolutionState' }
        current_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
    SolutionRevision:
      type: object
      additionalProperties: false
      required:
        - object_id
        - scope_id
        - owner_scope
        - generation
        - resource_version
        - created_at
        - updated_at
        - solution_id
        - ordinal
        - state
        - topology_digest
      properties:
        object_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        scope_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        owner_scope: { $ref: '#/components/schemas/ObjectIdentifier' }
        generation: { type: integer, minimum: 1 }
        resource_version: { type: string, minLength: 1, maxLength: 255, pattern: '^\S+$' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        solution_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        ordinal: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/RevisionState' }
        intent_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        blueprint_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        topology_digest: { $ref: '#/components/schemas/Digest' }
    TopologyNode:
      type: object
      additionalProperties: false
      required: [id, kind]
      properties:
        id: { type: string, minLength: 1, maxLength: 255 }
        kind: { type: string, minLength: 1, maxLength: 128 }
        provider_binding: { $ref: '#/components/schemas/ObjectIdentifier' }
        failure_domain: { type: string, minLength: 1, maxLength: 255 }
    TopologyEdge:
      type: object
      additionalProperties: false
      required: [from, to, relation]
      properties:
        from: { type: string, minLength: 1, maxLength: 255 }
        to: { type: string, minLength: 1, maxLength: 255 }
        relation: { type: string, minLength: 1, maxLength: 128 }
    TopologyView:
      type: object
      additionalProperties: false
      required: [solution_revision_id, topology_digest, nodes, edges]
      properties:
        solution_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        topology_digest: { $ref: '#/components/schemas/Digest' }
        nodes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TopologyNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/TopologyEdge' }
    ValidationFinding:
      type: object
      additionalProperties: false
      required: [code, severity, reason]
      properties:
        code: { type: string, minLength: 1, maxLength: 128 }
        severity: { $ref: '#/components/schemas/FindingSeverity' }
        affected_objects:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255 }
        reason: { type: string, minLength: 1, maxLength: 2048 }
        recommended_remediation: { type: string, maxLength: 2048 }
    ArchitectureValidationResult:
      type: object
      additionalProperties: false
      required:
        - object_id
        - scope_id
        - owner_scope
        - generation
        - resource_version
        - created_at
        - updated_at
        - solution_revision_id
        - status
        - evaluated_at
        - fresh_until
      properties:
        object_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        scope_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        owner_scope: { $ref: '#/components/schemas/ObjectIdentifier' }
        generation: { type: integer, minimum: 1 }
        resource_version: { type: string, minLength: 1, maxLength: 255, pattern: '^\S+$' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        solution_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        status: { $ref: '#/components/schemas/ValidationStatus' }
        evaluated_at: { type: string, format: date-time }
        fresh_until: { type: string, format: date-time }
        findings:
          type: array
          items: { $ref: '#/components/schemas/ValidationFinding' }
    DeploymentStep:
      type: object
      additionalProperties: false
      required: [id, capability, target_ref]
      properties:
        id: { type: string, minLength: 1, maxLength: 255 }
        capability: { type: string, minLength: 1, maxLength: 128 }
        target_ref: { type: string, minLength: 1, maxLength: 255 }
        depends_on:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255 }
    DeploymentPlan:
      type: object
      additionalProperties: false
      required:
        - object_id
        - scope_id
        - owner_scope
        - generation
        - resource_version
        - created_at
        - updated_at
        - solution_revision_id
        - plan_digest
        - state
        - steps
      properties:
        object_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        scope_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        owner_scope: { $ref: '#/components/schemas/ObjectIdentifier' }
        generation: { type: integer, minimum: 1 }
        resource_version: { type: string, minLength: 1, maxLength: 255, pattern: '^\S+$' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        solution_revision_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        plan_digest: { $ref: '#/components/schemas/Digest' }
        state: { $ref: '#/components/schemas/PlanState' }
        steps:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DeploymentStep' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, minLength: 1, maxLength: 128 }
        message: { type: string, minLength: 1, maxLength: 1024 }
        request_id: { type: string, maxLength: 255 }
