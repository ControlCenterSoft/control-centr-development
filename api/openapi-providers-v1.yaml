openapi: 3.1.0
info:
  title: Control Center Providers API
  version: 0.43.0
  description: >-
    Read-only Provider Contract v1 and ProviderBinding views. Capability metadata
    describes what a provider can support; it never authorizes or executes an
    infrastructure mutation.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/v1/providers:
    get:
      operationId: listProvidersV1
      responses:
        '200':
          description: Installed provider contracts visible in the caller scope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderManifest' }
                  count: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/providers/{providerId}:
    get:
      operationId: getProviderV1
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ProviderIdentifier' }
      responses:
        '200':
          description: Provider contract
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderManifest' }
        '404': { description: Provider not found }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/provider-bindings:
    get:
      operationId: listProviderBindingsV1
      parameters:
        - name: scope_id
          in: query
          schema: { $ref: '#/components/schemas/ObjectIdentifier' }
        - name: provider_id
          in: query
          schema: { $ref: '#/components/schemas/ProviderIdentifier' }
        - name: management_level
          in: query
          schema: { $ref: '#/components/schemas/ManagementLevel' }
      responses:
        '200':
          description: Provider bindings visible in the caller scope
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderBinding' }
                  count: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/APIError' }
  /api/v1/provider-bindings/{bindingId}:
    get:
      operationId: getProviderBindingV1
      parameters:
        - name: bindingId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectIdentifier' }
      responses:
        '200':
          description: One provider binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderBinding' }
        '404': { description: Provider binding not found }
        default: { $ref: '#/components/responses/APIError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    sessionCookie:
      type: apiKey
      in: cookie
      name: cc_session
  responses:
    APIError:
      description: Stable API error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ObjectIdentifier:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[A-Za-z0-9](?:[A-Za-z0-9._:-]{0,253}[A-Za-z0-9])?$'
    ProviderIdentifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[a-z0-9](?:[a-z0-9._:-]{0,126}[a-z0-9])?$'
    ManagementLevel:
      type: string
      enum: [observed, connected, managed]
    RiskClass:
      type: string
      enum: [read_only, low, medium, high, critical]
    QualificationStatus:
      type: string
      enum: [unverified, qualified, deprecated]
    BindingHealth:
      type: string
      enum: [healthy, degraded, unavailable, unknown]
    CapabilitySpec:
      type: object
      additionalProperties: false
      required: [id, management_levels, mutation, risk_class, idempotency]
      properties:
        id: { $ref: '#/components/schemas/ProviderIdentifier' }
        management_levels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/ManagementLevel' }
        mutation: { type: boolean }
        risk_class: { $ref: '#/components/schemas/RiskClass' }
        required_permissions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ProviderIdentifier' }
        required_secret_refs:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ProviderIdentifier' }
        preconditions:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255 }
        locks:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ProviderIdentifier' }
        idempotency: { type: string, minLength: 1, maxLength: 255 }
        verification:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 255 }
        failure_model: { type: string, maxLength: 512 }
        rollback: { type: string, maxLength: 512 }
        recovery: { type: string, maxLength: 512 }
    ProviderManifest:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - provider_id
        - contract_version
        - provider_version
        - product_family
        - supported_product_versions
        - management_levels
        - capabilities
        - qualification_status
      properties:
        schema_version: { type: string, const: provider.manifest/v1 }
        provider_id: { $ref: '#/components/schemas/ProviderIdentifier' }
        contract_version: { type: string, minLength: 1, maxLength: 64 }
        provider_version: { type: string, minLength: 1, maxLength: 64 }
        product_family: { type: string, minLength: 1, maxLength: 160 }
        supported_product_versions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
        management_levels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/ManagementLevel' }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/CapabilitySpec' }
        qualification_status: { $ref: '#/components/schemas/QualificationStatus' }
    ProviderBinding:
      type: object
      additionalProperties: false
      required:
        - object_id
        - scope_id
        - owner_scope
        - generation
        - resource_version
        - created_at
        - updated_at
        - provider_id
        - provider_version
        - contract_version
        - product_family
        - product_version
        - management_level
        - target_ref
        - health
      properties:
        object_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        scope_id: { $ref: '#/components/schemas/ObjectIdentifier' }
        owner_scope: { $ref: '#/components/schemas/ObjectIdentifier' }
        generation: { type: integer, minimum: 1 }
        resource_version: { type: string, minLength: 1, maxLength: 255, pattern: '^\S+$' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        provider_id: { $ref: '#/components/schemas/ProviderIdentifier' }
        provider_version: { type: string, minLength: 1, maxLength: 64 }
        contract_version: { type: string, minLength: 1, maxLength: 64 }
        product_family: { type: string, minLength: 1, maxLength: 160 }
        product_version: { type: string, minLength: 1, maxLength: 128 }
        management_level: { $ref: '#/components/schemas/ManagementLevel' }
        target_ref: { type: string, minLength: 1, maxLength: 255 }
        health: { $ref: '#/components/schemas/BindingHealth' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string, minLength: 1, maxLength: 128 }
        message: { type: string, minLength: 1, maxLength: 1024 }
        request_id: { type: string, maxLength: 255 }
